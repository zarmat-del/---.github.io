          {/* BOUTIQUES */}
          <section id="boutiques" className="max-w-7xl mx-auto px-4 py-16 w-full">
            <h2 className="text-3xl font-serif text-white mb-8 border-b border-neutral-800 pb-4">Бутики в Казахстане</h2>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              {STORES.map((s, i) => (
                <div key={i} className="p-5 bg-neutral-950 border border-neutral-800 space-y-3">
                  <span className="text-xs text-amber-400 font-bold uppercase">{CITIES.find(c => c.id === s.cityId)?.name}</span>
                  <h3 className="text-sm font-medium text-white">{s.name}</h3>
                  <p className="text-xs text-neutral-400">{s.address}</p>
                  <p className="text-xs text-neutral-500">{s.phone}</p>
                </div>
              ))}
            </div>
          </section>

          {/* FOOTER */}
          <footer className="bg-neutral-950 border-t border-neutral-800 py-8 text-center text-xs text-neutral-500">
            <p>© 2026 Federico Baccio Kazakhstan. Все права защищены.</p>
          </footer>

          {/* CITY MODAL */}
          {isCityModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="bg-neutral-900 border border-neutral-800 w-full max-w-sm rounded p-6 space-y-4">
                <h3 className="text-lg font-serif text-white">Выберите ваш город</h3>
                <div className="space-y-2">
                  {CITIES.map(c => (
                    <button key={c.id} onClick={() => { setCurrentCity(c.id); setIsCityModalOpen(false); }} className="w-full p-3 bg-neutral-950 border border-neutral-800 text-left text-sm text-neutral-200 hover:border-amber-400 rounded flex justify-between">
                      <span>{c.flag} {c.name}</span>
                      {currentCity === c.id && <span className="text-amber-400">✓</span>}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* CART DRAWER */}
          {isCartOpen && (
            <div className="fixed inset-0 z-50 bg-black/70 flex justify-end">
              <div className="w-full max-w-md bg-neutral-950 border-l border-neutral-800 p-6 flex flex-col justify-between">
                <div>
                  <div className="flex justify-between items-center border-b border-neutral-800 pb-4">
                    <h3 className="text-lg font-serif text-white">Корзина</h3>
                    <button onClick={() => setIsCartOpen(false)} className="text-neutral-400 text-lg">✕</button>
                  </div>
                  <div className="divide-y divide-neutral-800 max-h-[60vh] overflow-y-auto">
                    {cart.map((item, idx) => (
                      <div key={idx} className="py-3 flex justify-between text-xs">
                        <div>
                          <p className="text-white font-medium">{item.product.name}</p>
                          <p className="text-neutral-400">{formattedPrice(item.product.price)} x {item.quantity}</p>
                        </div>
                        <span className="font-semibold text-white">{formattedPrice(item.product.price * item.quantity)}</span>
                      </div>
                    ))}
                  </div>
                </div>
                <button onClick={() => alert('Заказ оформлен!')} className="w-full py-4 bg-white text-neutral-950 font-bold text-xs uppercase tracking-widest hover:bg-amber-400">
                  Оформить заказ ({formattedPrice(cart.reduce((a, b) => a + b.product.price * b.quantity, 0))})
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
